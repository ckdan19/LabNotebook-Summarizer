name: weekly-lab-digest

on:
  schedule:
    # 15:00 UTC Mondays = 08:00 America/Los_Angeles during PDT, 07:00 during PST.
    # GitHub cron is UTC-only and has no DST, so this drifts an hour in winter.
    # Scheduled runs can also be delayed or skipped under load — see the digest
    # step's note on why that is safe here.
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Window length in days"
        required: false
        default: "7"

permissions:
  contents: write

# Never let two digest runs overlap: both would write digests/.digest-state.json
# from the same base commit and the second push would clobber the first.
concurrency:
  group: weekly-lab-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # publish_digest.py needs python-markdown (or pandoc) — the only
      # non-stdlib dependency in the publish path.
      - name: Install Markdown converter
        run: python -m pip install --quiet markdown

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Pinned to an exact version, for the same reason --model is pinned
      # below: an unpinned install takes whatever the CLI happens to be on the
      # day the cron fires. The permission-prompt behaviour that silently
      # no-opped every run from 2026-08-25 to 2026-09-01 was CLI behaviour,
      # and the "blocked agent" regex further down greps for prompt phrasings
      # that are not stable across CLI versions. Bump this deliberately, and
      # run the workflow by hand once after bumping.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.261

      - name: Verify secrets are configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORDPRESS_TOKEN: ${{ secrets.WORDPRESS_TOKEN }}
        run: |
          missing=0
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."; missing=1; }
          [ -n "$WORDPRESS_TOKEN" ] || { echo "::error::WORDPRESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."; missing=1; }
          exit $missing

      - name: Install WordPress token
        env:
          WORDPRESS_TOKEN: ${{ secrets.WORDPRESS_TOKEN }}
        run: |
          install -d -m 700 "$HOME/.config/LabNotebook-Summarizer"
          umask 077
          printf '%s' "$WORDPRESS_TOKEN" > "$HOME/.config/LabNotebook-Summarizer/wp_token"
          chmod 600 "$HOME/.config/LabNotebook-Summarizer/wp_token"

      # ---------------------------------------------------------------------
      # Post archive (.cache/archive.db) — optional, and non-fatal.
      # Step 8 of the full-lab-digest skill ("Historical Connections") reads
      # this database read-only and silently skips the whole subsection if it
      # is absent. .cache/ is gitignored, so without a cache every CI run
      # would produce a digest missing that section. The build is incremental
      # and resumable, so a partial or timed-out refresh just resumes next week.
      # Delete these two steps if you would rather skip Historical Connections.
      # ---------------------------------------------------------------------
      - name: Restore post archive
        uses: actions/cache@v6
        with:
          path: .cache/archive.db
          key: archive-db-${{ github.run_id }}
          restore-keys: archive-db-

      - name: Refresh post archive (incremental)
        continue-on-error: true
        timeout-minutes: 25
        env:
          # Safe to pass here: this step runs plain Python, not Claude.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_archive.py

      # ---------------------------------------------------------------------
      # Generate the digest.
      #
      # This step deliberately receives NO GitHub token. It reads third-party
      # notebook posts — untrusted content — so it must not hold a credential
      # that can write to this repo. The five-source fetch uses roughly 10 of
      # the 60 unauthenticated GitHub API calls per hour, which is enough.
      # Committing happens in a separate step below, in plain shell.
      # ---------------------------------------------------------------------
      - name: Generate full lab digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          set -o pipefail
          # Built up in pieces so every line stays indented inside this block.
          ALLOWED="Task,Agent,Skill,Read,Write,Edit,Glob,Grep"
          # One rule for every python3 invocation — same reasoning as the daily
          # workflow. A per-script prefix rule is defeated by a redirect, a
          # pipe, or a leading `cd`, and the fall-through is an approval prompt
          # nothing in CI can answer. `python3 -c` was already allowed, so the
          # narrower rules were not containing anything. This step holds no
          # credentials, which is what keeps the rule acceptable.
          ALLOWED="$ALLOWED,Bash(python3:*)"
          # Broad on purpose: literature-connector shells out to curl for
          # PubMed and Europe PMC and the URLs are built at run time. This step
          # holds no credentials, which is what keeps the rule acceptable.
          ALLOWED="$ALLOWED,Bash(curl:*)"

          # Pin the model explicitly. Without --model these runs take whatever
          # the unpinned @anthropic-ai/claude-code default happens to be on the
          # day the cron fires, so a CLI default change would silently alter the
          # output of a published post.
          claude -p "Run the full-lab-digest skill for the last ${DAYS} days." \
            --model claude-sonnet-5 \
            --permission-mode acceptEdits \
            --max-turns 200 \
            --output-format text \
            --allowedTools "$ALLOWED" \
            2>&1 | tee "$RUNNER_TEMP/digest-run.log"

      # An agent that stopped to ask for tool approval produced nothing, and the
      # "no change under digests/" check below would blame the fetch or the
      # window for it. Name the real cause first so the artifact does not have
      # to be read by hand.
      - name: Assert the agent was not blocked
        run: |
          log="$RUNNER_TEMP/digest-run.log"
          [ -f "$log" ] || { echo "::error::No run log at $log — the digest step produced no output."; exit 1; }
          pattern='needs? (your |manual )?approval|approve the (pending )?(tool call|permission)|permission prompt|requires? permission to run'
          if grep -qiE "$pattern" "$log"; then
            echo "::error::The agent stopped to ask for tool approval, which nothing can" \
                 "grant in CI, so it exited without producing a digest. Check" \
                 "--allowedTools against the command the skill actually ran; the" \
                 "offending line follows."
            grep -inE "$pattern" "$log" >&2
            exit 1
          fi

      # Records WHICH digest file this run wrote, so the publish steps below
      # publish exactly that file. `ls -t` cannot be trusted for it: every file
      # from the checkout shares one mtime, so a run that changed only the state
      # file or index would hand an arbitrary old digest to a LIVE publish.
      - name: Confirm a digest was produced
        id: produced
        run: |
          git add -A digests/
          if git diff --cached --quiet; then
            echo "::error::The run produced no change under digests/." \
                 "Check the digest-run-log artifact — a fetch may have failed," \
                 "or every post in the window was already covered."
            exit 1
          fi
          git diff --cached --name-only
          digest="$(git diff --cached --name-only --diff-filter=AM -- 'digests/full-lab-digest-*.md' | tail -1)"
          if [ -z "$digest" ]; then
            echo "::error::digests/ changed but no full-lab-digest-*.md was written or" \
                 "updated, so there is nothing to publish. Check the digest-run-log artifact."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add weekly lab digest ($(date -u +%Y-%m-%d), ${DAYS:-7}d window)"

          # Rebase before pushing so a human commit landing mid-run is not
          # lost, and retry — the daily workflow can land its own state commit
          # on main while this 15-20 minute job is running, which makes a
          # first-try push rejection routine rather than exceptional. Same
          # loop as daily-literature.yml, including the rebase-abort: a pull
          # that hits a content conflict leaves the rebase in progress and
          # every later attempt would fail on "rebase already in progress".
          conflicted=false
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            if git rebase --abort 2>/dev/null; then
              conflicted=true
              echo "::warning::Rebase onto origin/${GITHUB_REF_NAME} conflicted on" \
                   "attempt ${attempt}; aborted it before retrying."
            fi
            sleep $((attempt * 5))
          done

          if [ "$conflicted" = "true" ]; then
            echo "::error::The digest commit conflicts with a change already on" \
                 "${GITHUB_REF_NAME} — most likely a hand edit to" \
                 "digests/.digest-state.json made while this run was in flight." \
                 "Nothing was published (the publish step runs after this one)." \
                 "Re-running is safe; the state file will be regenerated."
          else
            echo "::error::Could not push the digest commit after 3 attempts." \
                 "Nothing was published (the publish step runs after this one)." \
                 "Re-running is safe."
          fi
          exit 1
        env:
          DAYS: ${{ inputs.days || '7' }}

      # ---------------------------------------------------------------------
      # Pre-publish check — WordPress LIVE title.
      #
      # Modeled on rail B of daily-literature.yml. The digest and its
      # de-duplication state are already committed and pushed above, but the
      # live post itself is not durable anywhere in this repo: if an earlier
      # run published the digest and then failed (or it is re-run by hand),
      # WordPress may already carry this exact digest. WordPress is the one
      # source of truth that survives a failed run, so ask it directly before
      # publishing again rather than risk a duplicate live post.
      #
      # Only catches LIVE posts (the public API does not return drafts) — which
      # are exactly the ones where a duplicate actually matters.
      #
      # Matches on the FULL title, "Full Lab Digest — <range> (<n> days)",
      # which is unique per digest window: a different week's live post carries
      # a different date range and so cannot false-positive against this one.
      # The title compared is the one publish_digest.py will itself use (same
      # split_digest), so the check and the publish can never drift apart.
      #
      # A fetch that fails does NOT block — publishing proceeds, same as rail B.
      # ---------------------------------------------------------------------
      - name: Pre-publish check — WordPress
        id: pre_publish
        env:
          DIGEST: ${{ steps.produced.outputs.digest }}
        run: |
          digest="$DIGEST"
          # A window wide enough to contain a re-run of a recent weekly digest.
          # Exact-title matching means a wider window only costs API pages; it
          # cannot turn an unrelated post into a false positive.
          python3 scripts/fetch_lab_posts.py --days 14 > "$RUNNER_TEMP/posts.json" || true
          python3 - "$digest" "$RUNNER_TEMP/posts.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, "scripts")
          from publish_digest import split_digest
          title, _ = split_digest(sys.argv[1])
          want = title.strip().lower()
          try:
              data = json.load(open(sys.argv[2]))
          except (OSError, ValueError) as exc:
              # Cannot verify — do not block; a publish failure still fails loudly.
              print(f"::warning::Could not check WordPress for an existing digest "
                    f"({exc}). Publishing anyway.", file=sys.stderr)
              print("skip=false")
              sys.exit(0)
          if data.get("error"):
              print(f"::warning::Post fetch failed: {data['error']}. Publishing anyway.",
                    file=sys.stderr)
              print("skip=false")
              sys.exit(0)
          dupes = [p for p in data.get("posts", [])
                   if (p.get("title") or "").strip().lower() == want]
          if dupes:
              print(f"::notice::A live digest titled {title!r} already exists "
                    f"({dupes[0].get('url')}); skipping publish. The digest file and "
                    f"state commit above still stand.", file=sys.stderr)
              print("skip=true")
          else:
              print("skip=false")
          PY

      # ---------------------------------------------------------------------
      # Publish the digest to WordPress LIVE.
      #
      # This hands the freshly generated digest to publish_digest.py with
      # --status publish so the post goes live immediately. publish_digest.py
      # defaults to draft and treats --status publish as an explicit override,
      # which is passed here. The token installed above is read by
      # publish_digest.py from disk and only ever sent in a request header.
      #
      # Runs after commit/push so the digest and its de-duplication state are
      # already durable on the branch; a publish failure then fails loudly
      # without having lost that state, and re-publishing by hand is safe.
      #
      # Skipped when the pre-publish check found this exact digest already live.
      # ---------------------------------------------------------------------
      - name: Publish digest live
        if: steps.pre_publish.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.produced.outputs.digest }}
        run: |
          digest="$DIGEST"
          echo "Publishing live from ${digest}"
          python3 scripts/publish_digest.py "$digest" --status publish

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-run-log
          path: ${{ runner.temp }}/digest-run.log
          if-no-files-found: warn
